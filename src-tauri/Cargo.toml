[package]
name = "lkos"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "LKOS Windows foundation"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
